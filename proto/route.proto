// Route protocol wire format — BGP-style path advertisement.

syntax = "proto3";

package route.v1;

option go_package = "github.com/bbmumford/route/proto/pb";

// PathAdvertisement is the wire format for a route advertisement. Dual-
// signed: NodeIDSignature (signed by Origin's node identity) AND
// PathKeySignature (signed by a per-path key derived via
// HKDF-SHA256(node-identity, "route-path-v1" || Origin || Target || Epoch)).
//
// Defense-in-depth: even if a node-identity compromise leaks a path-key for
// one (origin,target,epoch), replay across different pairs is impossible.
message PathAdvertisement {
  bytes  origin = 1;             // who is advertising
  bytes  target = 2;              // the destination peer
  repeated bytes hops = 3;        // intermediate NodeIDs (excludes origin + target)
  uint32 rttSampleMs = 4;         // observed RTT from origin to target via this path
  uint64 epoch = 5;               // advertisement epoch (monotonic per Origin)
  repeated string communities = 6; // tag-style metadata
  int64  issuedAt = 7;             // unix nanoseconds
  string network = 8;              // network scope (empty = fleet-wide)

  bytes nodeIdSignature = 9;       // Ed25519 over wire-format excluding signatures
  bytes pathKeySignature = 10;     // Ed25519 over same envelope, by per-path key
  // pubKey is the Origin's Ed25519 public key. Required because NodeIDs in
  // this codebase are one-way SHA-256 fingerprints (vl1_<hex>) — the verifier
  // cannot derive the public key from the NodeID alone. Sender stamps this
  // before signing; signing input MUST include pubKey to close the rebind
  // attack (an attacker who swaps pubKey + re-signs with their own key would
  // otherwise produce a valid signature). See ledger v0.0.15 SignRecord fix.
  bytes pubKey = 11;
  // pathPubKey is the per-path key's public key, which pathKeySignature
  // verifies under; signed with pubKey under nodeIdSignature.
  bytes pathPubKey = 12;
}

// PathWithdrawal removes a previously-advertised path.
message PathWithdrawal {
  bytes  origin = 1;
  bytes  target = 2;
  uint64 epoch = 3;
  int64  issuedAt = 4;
  string network = 5;
  bytes  signature = 6; // Ed25519 by origin
  bytes  pubKey = 7;   // Origin's Ed25519 public key — see PathAdvertisement.pubKey
}

// DampingState is the per-(origin,target,network) flap-damping state.
// Not a wire format — included here for completeness of the proto package.
message DampingState {
  bytes  origin = 1;
  bytes  target = 2;
  string network = 3;
  uint32 penalty = 4;         // RFC2439 accumulated penalty
  bool   suppressed = 5;
  int64  lastFlap = 6;
}
